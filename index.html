<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>半导体投研信息中心</title>
<style>
:root {
  --bg: #0d1117;
  --card-bg: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --text-muted: #8b949e;
  --accent: #58a6ff;
  --accent-hover: #79c0ff;
  --green: #f85149;
  --red: #3fb950;
  --yellow: #d29922;
  --tab-active: #1f6feb;
  --tab-count-bg: rgba(255,255,255,0.15);
  --red-bg: rgba(63,185,80,0.15);
  --red-border: rgba(63,185,80,0.3);
  --accent-bg: rgba(88,166,255,0.12);
  --accent-border: rgba(88,166,255,0.25);
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f6f8fa;
    --card-bg: #ffffff;
    --border: #d0d7de;
    --text: #1f2328;
    --text-muted: #656d76;
    --accent: #0969da;
    --accent-hover: #0550ae;
    --green: #cf222e;
    --red: #1a7f37;
    --yellow: #9a6700;
    --tab-active: #0969da;
    --tab-count-bg: rgba(0,0,0,0.08);
    --red-bg: rgba(26,127,55,0.12);
    --red-border: rgba(26,127,55,0.3);
    --accent-bg: rgba(9,105,218,0.1);
    --accent-border: rgba(9,105,218,0.25);
  }
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
}
.container { max-width: 900px; margin: 0 auto; padding: 20px; }
header {
  text-align: center;
  padding: 40px 20px 24px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 24px;
}
header h1 {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: 1px;
  margin-bottom: 6px;
}
header .subtitle {
  color: var(--text-muted);
  font-size: 13px;
}
.tab-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.tab {
  padding: 10px 20px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-muted);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.tab:hover { border-color: var(--accent); color: var(--text); }
.tab.active {
  background: var(--tab-active);
  border-color: var(--tab-active);
  color: #fff;
}
.tab .tab-icon { font-size: 16px; }
.tab .tab-count {
  font-size: 11px;
  background: var(--tab-count-bg);
  padding: 1px 6px;
  border-radius: 8px;
  margin-left: 4px;
}
.category-panel { display: none; }
.category-panel.active { display: block; }
.category-header {
  margin-bottom: 16px;
}
.category-header h2 {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 4px;
}
.category-header p {
  font-size: 13px;
  color: var(--text-muted);
}
.report-list { display: flex; flex-direction: column; gap: 12px; }
.report-card {
  display: block;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 20px 24px;
  text-decoration: none;
  color: var(--text);
  transition: border-color 0.2s, transform 0.1s;
}
.report-card:hover {
  border-color: var(--accent);
  transform: translateX(4px);
}
.report-card .card-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--accent);
  margin-bottom: 4px;
}
.report-card .card-date {
  font-size: 13px;
  color: var(--text-muted);
}
.report-card .badge {
  display: inline-block;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 12px;
  margin-left: 8px;
  vertical-align: middle;
}
.badge-new {
  background: var(--red-bg);
  color: var(--green);
  border: 1px solid var(--red-border);
}
.badge-cat {
  background: var(--accent-bg);
  color: var(--accent);
  border: 1px solid var(--accent-border);
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 12px;
  margin-left: 8px;
}
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
}
.empty-state .icon { font-size: 48px; margin-bottom: 16px; }
.empty-state p { font-size: 14px; }
footer {
  text-align: center;
  padding: 40px 20px 20px;
  color: var(--text-muted);
  font-size: 12px;
  border-top: 1px solid var(--border);
  margin-top: 40px;
}
footer a { color: var(--accent); text-decoration: none; }
.loading {
  text-align: center;
  padding: 40px;
  color: var(--text-muted);
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>半导体投研信息中心</h1>
    <p class="subtitle">全球半导体产业资讯 + AI服务器产业链深度研究</p>
  </header>
  <div id="tab-bar" class="tab-bar">
    <div class="loading">加载中...</div>
  </div>
  <div id="panels"></div>
  <footer>
    <p>本站内容仅为公开信息整理，不构成投资建议，股市风险自担</p>
    <p style="margin-top:8px;">由 TRAE 自动生成与部署</p>
  </footer>
</div>
<script>
(async function() {
  const tabBar = document.getElementById('tab-bar');
  const panelsEl = document.getElementById('panels');
  const weekdays = ['周日','周一','周二','周三','周四','周五','周六'];
  const today = new Date().toISOString().slice(0, 10);

  try {
    const res = await fetch('manifest.json?t=' + Date.now());
    if (!res.ok) throw new Error('manifest not found');
    const data = await res.json();

    var categories = data.categories || [];
    if (categories.length === 0) {
      tabBar.innerHTML = '';
      panelsEl.innerHTML = '<div class="empty-state"><div class="icon">📋</div><p>暂无内容，请等待自动生成</p></div>';
      return;
    }

    tabBar.innerHTML = categories.map(function(cat, i) {
      var count = (cat.reports || []).length;
      return '<div class="tab' + (i === 0 ? ' active' : '') + '" data-cat="' + i + '">' +
        '<span class="tab-icon">' + (cat.icon || '📄') + '</span>' +
        '<span>' + cat.name + '</span>' +
        '<span class="tab-count">' + count + '</span>' +
        '</div>';
    }).join('');

    panelsEl.innerHTML = categories.map(function(cat, i) {
      var reports = cat.reports || [];
      var reportCards = '';
      if (reports.length === 0) {
        reportCards = '<div class="empty-state"><div class="icon">' + (cat.icon || '📄') + '</div><p>暂无报告</p></div>';
      } else {
        reportCards = reports.map(function(r) {
          var isToday = (r.date || '') === today;
          var badge = isToday ? '<span class="badge badge-new">今日</span>' : '';
          var title = r.title || (r.date + ' 早报');
          var dateDisplay = r.date || '';
          if (dateDisplay) {
            var d = new Date(dateDisplay + 'T00:00:00');
            if (!isNaN(d)) {
              dateDisplay = dateDisplay + ' ' + (weekdays[d.getDay()] || '');
            }
          }
          var subText = r.subtitle || '点击查看完整报告';
          return '<a class="report-card" href="' + r.file + '">' +
            '<div><span class="card-title">' + title + '</span>' + badge + '</div>' +
            '<div class="card-date">' + dateDisplay + ' · ' + subText + '</div>' +
            '</a>';
        }).join('');
      }
      return '<div class="category-panel' + (i === 0 ? ' active' : '') + '" data-panel="' + i + '">' +
        '<div class="category-header"><h2>' + (cat.icon || '📄') + ' ' + cat.name + '</h2>' +
        '<p>' + (cat.description || '') + '</p></div>' +
        '<div class="report-list">' + reportCards + '</div>' +
        '</div>';
    }).join('');

    tabBar.querySelectorAll('.tab').forEach(function(tab) {
      tab.addEventListener('click', function() {
        var idx = this.getAttribute('data-cat');
        tabBar.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
        panelsEl.querySelectorAll('.category-panel').forEach(function(p) { p.classList.remove('active'); });
        this.classList.add('active');
        var panel = panelsEl.querySelector('[data-panel="' + idx + '"]');
        if (panel) panel.classList.add('active');
      });
    });
  } catch (e) {
    tabBar.innerHTML = '';
    panelsEl.innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><p>加载失败，请稍后刷新</p></div>';
  }
})();
</script>
</body>
</html>
